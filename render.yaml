# Virar Organics: free testing deployment, with no paid disks or services.
# Free PostgreSQL expires after 30 days. Export data before its expiry.
# Free web services sleep after 15 idle minutes; Key Value is not persistent.
# Secrets are generated by Render or referenced from the private database.
previews:
  generation: 'off'
projects:
  - name: Virar Organics
    environments:
      - name: production
        databases:
          - name: virar-organics-postgres
            databaseName: virar_store
            user: virar_app
            region: singapore
            plan: free
            postgresMajorVersion: "18"
            ipAllowList: []
        services:
          - type: web
            name: virar-organics-api
            runtime: node
            region: singapore
            plan: free
            numInstances: 1
            repo: https://github.com/AMANMISHRA1511/virar-organics
            branch: main
            rootDir: backend
            autoDeployTrigger: commit
            buildCommand: npm ci --omit=dev
            startCommand: node scripts/start-free.mjs
            healthCheckPath: /api/ready
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: 24.22.3
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "10000"
              - key: JWT_SECRET
                generateValue: true
              - key: ALLOWED_ORIGINS
                value: https://virar-organics.netlify.app
              - key: TRUST_PROXY
                value: "1"
              - key: DB_CLIENT
                value: postgres
              - key: DATABASE_URL
                fromDatabase:
                  name: virar-organics-postgres
                  property: connectionString
              - key: DB_POOL_SIZE
                value: "4"
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: virar-organics-keyvalue
                  property: connectionString
              - key: REDIS_PREFIX
                value: virar-production
              - key: UPLOAD_STORAGE
                value: database
              - key: IMPORT_BUNDLED_CATALOGUE
                value: "true"
              - key: EMBEDDED_WORKER
                value: "true"
              - key: SOCKET_PING_INTERVAL_MS
                value: "10000"
              - key: SOCKET_PING_TIMEOUT_MS
                value: "10000"
              - key: PAYMENT_MODE
                value: disabled
              - key: PHONE_OTP_MODE
                value: disabled
              - key: NOTIFICATION_MODE
                value: disabled
              - key: GOOGLE_CLIENT_ID
                value: ""
              - key: MAP_ENABLED
                value: "false"
              - key: LOCATION_PROVIDER
                value: bigdatacloud
              - key: RATE_LIMIT_MULTIPLIER
                value: "1"
          - type: keyvalue
            name: virar-organics-keyvalue
            region: singapore
            plan: free
            maxmemoryPolicy: noeviction
            persistenceMode: 'off'
            ipAllowList: []
