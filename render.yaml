# Virar Organics production infrastructure.
# Review the Render plan and recurring charges before the first approval.
# This file contains no credential values: Render generates or references them.
#
# Conditional baseline: API $7 + MySQL $7 + Key Value $10 + disks $2.75
# = $26.75/month before tax, overage, backups, and optional provider charges.
# MySQL capacity at 512 MB must be checked during the first deployment.
# A later move to a 2 GB MySQL plan raises this baseline to $44.75/month.
# No automatic plan upgrades, preview stacks, demo seed, or Admin creation.
# Disk-backed services run one instance and pause briefly during redeployment.

previews:
  generation: 'off'

projects:
  - name: Virar Organics
    environments:
      - name: production
        services:
          - type: web
            name: virar-organics-api
            runtime: node
            region: singapore
            plan: 0.5c-512mb
            numInstances: 1
            repo: https://github.com/AMANMISHRA1511/virar-organics
            branch: main
            rootDir: backend
            autoDeployTrigger: commit
            buildCommand: npm ci --omit=dev
            # SQL-only migrations: pre-deploy processes cannot access the upload disk.
            # MySQL must finish its first initialization before this succeeds.
            preDeployCommand: npm run migrate
            startCommand: npm start
            healthCheckPath: /api/ready
            disk:
              name: virar-organics-uploads
              mountPath: /var/data
              sizeGB: 1
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: 24.22.3
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "10000"
              - key: JWT_SECRET
                generateValue: true
              # Exact public storefront origin; this value is not a secret.
              - key: ALLOWED_ORIGINS
                value: https://virar-organics.netlify.app
              # Verify the deployed proxy's client-IP forwarding before launch.
              - key: TRUST_PROXY
                value: "1"
              - key: DB_HOST
                fromService:
                  type: pserv
                  name: virar-organics-mysql
                  property: host
              - key: DB_PORT
                value: "3306"
              - key: DB_NAME
                fromService:
                  type: pserv
                  name: virar-organics-mysql
                  envVarKey: MYSQL_DATABASE
              - key: DB_USER
                fromService:
                  type: pserv
                  name: virar-organics-mysql
                  envVarKey: MYSQL_USER
              - key: DB_PASSWORD
                fromService:
                  type: pserv
                  name: virar-organics-mysql
                  envVarKey: MYSQL_PASSWORD
              - key: DB_POOL_SIZE
                value: "12"
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: virar-organics-keyvalue
                  property: connectionString
              - key: REDIS_PREFIX
                value: virar-production
              - key: UPLOAD_DIR
                value: /var/data/uploads
              # The API runs the notification worker; no separate worker is provisioned.
              - key: EMBEDDED_WORKER
                value: "true"
              # Netlify builds use HTTP polling; keep the heartbeat budget under 26s.
              - key: SOCKET_PING_INTERVAL_MS
                value: "10000"
              - key: SOCKET_PING_TIMEOUT_MS
                value: "10000"
              # Configure providers separately before activating payment/OTP/messages.
              # COD and private persistent in-app notices remain application features.
              - key: PAYMENT_MODE
                value: disabled
              - key: PHONE_OTP_MODE
                value: disabled
              - key: NOTIFICATION_MODE
                value: disabled
              - key: GOOGLE_CLIENT_ID
                value: ""
              - key: MAP_ENABLED
                value: "false"
              - key: LOCATION_PROVIDER
                value: disabled
              - key: RATE_LIMIT_MULTIPLIER
                value: "1"

          - type: pserv
            name: virar-organics-mysql
            runtime: image
            image:
              url: docker.io/library/mysql:8.4
            # Preserve the official image entrypoint; run the standard MySQL server.
            # MySQL X protocol is unused by this application.
            dockerCommand: mysqld --mysqlx=0
            region: singapore
            # Conditional minimum only; see the memory caveat above before applying.
            plan: 0.5c-512mb
            numInstances: 1
            disk:
              name: virar-organics-mysql-data
              mountPath: /var/lib/mysql
              sizeGB: 10
            envVars:
              - key: MYSQL_DATABASE
                value: virar_store
              - key: MYSQL_USER
                value: virar_app
              - key: MYSQL_PASSWORD
                generateValue: true
              - key: MYSQL_ROOT_PASSWORD
                generateValue: true
            # No MYSQL_ROOT_HOST override and no public database service.
            # These initialization variables do not rotate an existing DB password.

          - type: keyvalue
            name: virar-organics-keyvalue
            region: singapore
            plan: 256mb
            maxmemoryPolicy: noeviction
            persistenceMode: journal-snapshot
            ipAllowList: []
